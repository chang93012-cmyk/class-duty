function StudentManager({data, setData}){
  const [editing,setEditing] = useState(null);
  const newStudent = ()=>setEditing({
    id:null, name:'', number:data.students.length+1, gender:'M',
    roleIds:[], position:null, points:0, password:DEFAULT_STUDENT_PW
  });
  const save = ()=>{
    if(!editing.name.trim()){ alert('이름을 입력하세요'); return; }
    setData(prev=>{
      const nd = structuredClone(prev);
      if(editing.position){
        nd.students.forEach(s=>{ if(s.id!==editing.id && s.position===editing.position) s.position=null; });
      }
      if(editing.position==='maleVP' && editing.gender!=='M'){ alert('남부회장은 남학생만'); return prev; }
      if(editing.position==='femaleVP' && editing.gender!=='F'){ alert('여부회장은 여학생만'); return prev; }
      if(editing.id){
        const idx = nd.students.findIndex(s=>s.id===editing.id);
        nd.students[idx] = editing;
      } else {
        nd.students.push({...editing, id:uid()});
      }
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`👤 '${editing.name}' 학생 정보 ${editing.id?'수정':'추가'}`, ts:Date.now() });
      return nd;
    });
    setEditing(null);
  };
  const remove = (s)=>{
    if(!confirm(`'${s.name}' 학생을 삭제할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.students = nd.students.filter(x=>x.id!==s.id);
      Object.keys(nd.checks).forEach(d=>{ delete nd.checks[d][s.id]; });
      if(nd.roleRequests){
        Object.keys(nd.roleRequests).forEach(d=>{ if(nd.roleRequests[d]) delete nd.roleRequests[d][s.id]; });
      }
      if(nd.layout && nd.layout.tiles){
        Object.values(nd.layout.tiles).forEach(t=>{
          if(t && t.type==='desk' && t.studentId===s.id){ t.studentId=null; t.roleId=null; }
        });
      }
      nd.ownedCoupons = (nd.ownedCoupons||[]).filter(oc=>oc.studentId!==s.id);
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🗑 '${s.name}' 학생 삭제`, ts:Date.now() });
      return nd;
    });
  };
  const resetPw = (s)=>{
    if(!confirm(`'${s.name}'의 비밀번호를 '${DEFAULT_STUDENT_PW}'로 초기화할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const x = nd.students.find(y=>y.id===s.id);
      if(x) x.password = DEFAULT_STUDENT_PW;
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🔑 '${s.name}' 비밀번호 초기화`, ts:Date.now() });
      return nd;
    });
  };
  const setPw = (s)=>{
    const v = prompt(`'${s.name}'의 새 비밀번호`, s.password || DEFAULT_STUDENT_PW);
    if(!v) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const x = nd.students.find(y=>y.id===s.id);
      if(x) x.password = v;
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🔑 '${s.name}' 비밀번호 변경`, ts:Date.now() });
      return nd;
    });
  };
  const sorted = [...data.students].sort((a,b)=>a.number-b.number);
  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-2">
        <h3 className="font-bold text-lg">👨‍👩‍👧 학생 명단</h3>
        <button className="px-3 py-1.5 bg-violet-600 text-white rounded-lg text-sm font-semibold" onClick={newStudent}>➕ 학생 추가</button>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-gray-50">
            <tr>
              <th className="p-2 text-left">번호</th>
              <th className="p-2 text-left">이름</th>
              <th className="p-2 text-left">성별</th>
              <th className="p-2 text-left">직책</th>
              <th className="p-2 text-left">💰 P</th>
              <th className="p-2 text-left">🔑 비번</th>
              <th className="p-2"></th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(s=>(
              <tr key={s.id} className="border-t">
                <td className="p-2">{s.number}</td>
                <td className="p-2 font-semibold">{s.name}</td>
                <td className="p-2">{s.gender==='M'?'👦':'👧'}</td>
                <td className="p-2">{s.position?<Badge position={s.position}/>:<span className="text-gray-400">-</span>}</td>
                <td className="p-2 font-bold text-emerald-700">{s.points||0}P</td>
                <td className="p-2">
                  <code className="text-xs bg-gray-100 px-1 rounded">{s.password || DEFAULT_STUDENT_PW}</code>
                </td>
                <td className="p-2 text-right whitespace-nowrap">
                  <button className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded mr-1" onClick={()=>setEditing({...s})}>✏</button>
                  <button className="px-2 py-1 text-xs bg-yellow-100 text-yellow-700 rounded mr-1" onClick={()=>setPw(s)}>🔑 변경</button>
                  <button className="px-2 py-1 text-xs bg-gray-100 text-gray-700 rounded mr-1" onClick={()=>resetPw(s)}>♻ 초기화</button>
                  <button className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded" onClick={()=>remove(s)}>🗑</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title={editing?.id?'학생 수정':'학생 추가'} wide>
        {editing && (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-2">
              <label className="block">
                <div className="text-xs text-gray-500">번호</div>
                <input type="number" className="border rounded p-2 w-full" value={editing.number} onChange={e=>setEditing({...editing, number:parseInt(e.target.value)||0})}/>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">이름</div>
                <input className="border rounded p-2 w-full" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})}/>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">성별</div>
                <select className="border rounded p-2 w-full" value={editing.gender} onChange={e=>{
                  const g=e.target.value; let p=editing.position;
                  if(p==='maleVP'&&g!=='M') p=null; if(p==='femaleVP'&&g!=='F') p=null;
                  setEditing({...editing, gender:g, position:p});
                }}>
                  <option value="M">👦 남</option><option value="F">👧 여</option>
                </select>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">학급임원 직책</div>
                <select className="border rounded p-2 w-full" value={editing.position||''} onChange={e=>setEditing({...editing, position:e.target.value||null})}>
                  <option value="">없음</option>
                  <option value="president">👑 회장</option>
                  {editing.gender==='M' && <option value="maleVP">💙 남부회장</option>}
                  {editing.gender==='F' && <option value="femaleVP">🌸 여부회장</option>}
                </select>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">💰 포인트</div>
                <input type="number" className="border rounded p-2 w-full" value={editing.points||0} onChange={e=>setEditing({...editing, points:parseInt(e.target.value)||0})}/>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">🔑 비밀번호</div>
                <input className="border rounded p-2 w-full" value={editing.password||DEFAULT_STUDENT_PW} onChange={e=>setEditing({...editing, password:e.target.value})}/>
              </label>
            </div>
            <div>
              <div className="text-xs text-gray-500 mb-1">담당 역할</div>
              <div className="flex flex-wrap gap-1">
                {data.roles.map(r=>{
                  const on = editing.roleIds.includes(r.id);
                  return (
                    <button key={r.id} type="button"
                      onClick={()=>setEditing({...editing, roleIds: on?editing.roleIds.filter(x=>x!==r.id):[...editing.roleIds,r.id]})}
                      className={`px-2 py-1 text-sm rounded-full border ${on?'bg-violet-600 text-white border-violet-600':'bg-gray-50'}`}>
                      {on?'✓ ':''}{r.name}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="flex-1 p-2 bg-gray-200 rounded-lg" onClick={()=>setEditing(null)}>취소</button>
              <button className="flex-1 p-2 bg-violet-600 text-white rounded-lg font-bold" onClick={save}>저장</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}
/* ============================================================

function Barcode(){
  const widths = [2,1,3,1,2,1,1,3,2,1,2,3,1,2,1,2,1,3,1,2,2,1,3,1,2,1,2];
  return (
    <div className="barcode">
      {widths.map((w,i)=>(<span key={i} style={{width:`${w}px`}} />))}
    </div>
  );
}
function CouponTicket({coupon, status='active', children}){
  return (
    <div className={`coupon-ticket ${status==='used'?'used':''} ${status==='pending'?'pending':''}`}>
      <Barcode/>
      <div className="text-center">
        <div className="text-5xl mb-1">{coupon.emoji || '🎁'}</div>
        <div className="font-extrabold text-xl text-gray-800 mb-1">{coupon.name}</div>
        <div className="text-sm text-gray-500 font-semibold">{coupon.price}P</div>
      </div>
      <div className="mt-3 pt-2 border-t border-dashed border-gray-300 text-[9px] text-gray-500 leading-tight text-center">
        <div>사용기간: 학년이 바뀌기 전까지</div>
        <div>교환처: 담임 선생님</div>
        <div className="mt-0.5">&lt;쿠폰은 상대방과 교환하거나 줄 수 없습니다&gt;</div>
      </div>
      {children}
    </div>
  );
}
function CouponStore({data, setData, student, onLogout, hideLogout=false}){
  const me = data.students.find(s=>s.id===student.id) || student;
  const myOwned = (data.ownedCoupons||[]).filter(oc=>oc.studentId===me.id);
  const activeOwned = myOwned.filter(oc=>oc.status==='active');
  const pendingOwned = myOwned.filter(oc=>oc.status==='pending');

  const buy = (coupon)=>{
    if((me.points||0) < coupon.price){ alert('포인트가 부족해요'); return; }
    if(!confirm(`'${coupon.name}' (${coupon.price}P) 구매할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const s = nd.students.find(x=>x.id===me.id);
      if(!s) return prev;
      if((s.points||0) < coupon.price){ return prev; }
      const before = s.points||0;
      s.points = before - coupon.price;
      const owned = {
        id: uid(),
        couponId: coupon.id,
        studentId: s.id,
        status: 'active',
        purchasedAt: Date.now()
      };
      nd.ownedCoupons = [...(nd.ownedCoupons||[]), owned];
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'student', name:s.name},
        desc:`🛒 ${s.name}이(가) '${coupon.name}' 구매 (-${coupon.price}P) (${before}P → ${s.points}P)`,
        ts: Date.now()
      });
      return nd;
    });
  };
  const requestUse = (owned, coupon)=>{
    if(!confirm(`'${coupon.name}' 사용을 선생님께 요청할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const o = nd.ownedCoupons.find(x=>x.id===owned.id);
      if(!o || o.status!=='active') return prev;
      o.status = 'pending';
      o.requestedAt = Date.now();
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'student', name:me.name},
        desc:`✋ ${me.name}이(가) '${coupon.name}' 사용 요청 (승인 대기)`,
        ts: Date.now()
      });
      return nd;
    });
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl shadow p-4 flex items-center justify-between flex-wrap gap-2">
        <div>
          <div className="text-sm text-gray-500">로그인</div>
          <div className="text-xl font-bold">
            {me.gender==='M'?'👦':'👧'} {me.name}
            {me.position && <span className="ml-2"><Badge position={me.position}/></span>}
          </div>
        </div>
        <div className="flex items-center gap-3">
          <div className="text-right">
            <div className="text-xs text-gray-500">내 포인트</div>
            <div className="text-2xl font-extrabold text-emerald-600">💰 {me.points||0}P</div>
          </div>
          {!hideLogout && (
            <button onClick={onLogout}
              className="px-3 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-bold">🚪 로그아웃</button>
          )}
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow p-4">
        <h3 className="font-bold text-lg mb-3">🎫 내 쿠폰함 ({activeOwned.length + pendingOwned.length}장)</h3>
        {(activeOwned.length+pendingOwned.length)===0 ? (
          <div className="text-sm text-gray-400 text-center p-4">아직 보유한 쿠폰이 없어요</div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {pendingOwned.map(oc=>{
              const c = data.coupons.find(x=>x.id===oc.couponId);
              if(!c) return null;
              return (
                <div key={oc.id}>
                  <CouponTicket coupon={c} status="pending">
                    <div className="mt-2 text-center">
                      <div className="text-xs font-bold text-amber-700">⏳ 승인 대기 중</div>
                    </div>
                  </CouponTicket>
                </div>
              );
            })}
            {activeOwned.map(oc=>{
              const c = data.coupons.find(x=>x.id===oc.couponId);
              if(!c) return null;
              return (
                <div key={oc.id}>
                  <CouponTicket coupon={c} status="active"/>
                  <button onClick={()=>requestUse(oc, c)}
                    className="mt-2 w-full p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold text-sm">
                    ✋ 사용하기
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl shadow p-4">
        <h3 className="font-bold text-lg mb-3">🛒 쿠폰 상점</h3>
        {data.coupons.length===0 ? (
          <div className="text-sm text-gray-400 text-center p-4">선생님이 등록한 쿠폰이 없어요</div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {data.coupons.map(c=>{
              const canBuy = (me.points||0) >= c.price;
              return (
                <div key={c.id}>
                  <CouponTicket coupon={c}/>
                  <button onClick={()=>buy(c)} disabled={!canBuy}
                    className={`mt-2 w-full p-2 rounded-lg font-bold text-sm
                      ${canBuy?'bg-emerald-500 hover:bg-emerald-600 text-white':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                    {canBuy ? `🛒 ${c.price}P로 구매` : `💸 포인트 부족 (${c.price}P 필요)`}
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}
function CouponManager({data, setData}){
  const [form, setForm] = useState({name:'', price:10, emoji:'🎁'});
  const [editing, setEditing] = useState(null);
  const pending = (data.ownedCoupons||[]).filter(oc=>oc.status==='pending');

  const create = ()=>{
    if(!form.name.trim()){ alert('쿠폰명을 입력하세요'); return; }
    const price = parseInt(form.price);
    if(!price || price<0){ alert('가격을 입력하세요'); return; }
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.coupons.push({ id:uid(), name:form.name.trim(), price, emoji:form.emoji||'🎁' });
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`➕ 새 쿠폰 '${form.name.trim()}' (${price}P) 발행`, ts: Date.now()
      });
      return nd;
    });
    setForm({name:'', price:10, emoji:'🎁'});
  };
  const saveEdit = ()=>{
    if(!editing) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const c = nd.coupons.find(x=>x.id===editing.id);
      if(!c) return prev;
      c.name = editing.name; c.price = parseInt(editing.price)||0; c.emoji = editing.emoji||'🎁';
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`✏ 쿠폰 '${c.name}' 수정 (${c.price}P)`, ts: Date.now()
      });
      return nd;
    });
    setEditing(null);
  };
  const remove = (c)=>{
    if(!confirm(`'${c.name}' 쿠폰을 삭제할까요? (이미 구매된 쿠폰은 유지됩니다)`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.coupons = nd.coupons.filter(x=>x.id!==c.id);
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🗑 쿠폰 '${c.name}' 삭제`, ts: Date.now()
      });
      return nd;
    });
  };
  const approve = (oc)=>{
    const c = data.coupons.find(x=>x.id===oc.couponId);
    const stu = data.students.find(s=>s.id===oc.studentId);
    if(!confirm(`'${stu?.name}'의 '${c?.name}' 사용을 승인할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const o = nd.ownedCoupons.find(x=>x.id===oc.id);
      if(!o) return prev;
      o.status = 'used';
      o.processedAt = Date.now();
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`✅ 👨‍🏫 선생님이 ${stu?.name}의 '${c?.name}' 사용 승인 (사용 완료)`,
        ts: Date.now()
      });
      return nd;
    });
  };
  const reject = (oc)=>{
    const c = data.coupons.find(x=>x.id===oc.couponId);
    const stu = data.students.find(s=>s.id===oc.studentId);
    if(!confirm(`'${stu?.name}'의 '${c?.name}' 사용을 반려할까요? (다시 보유 상태로 되돌립니다)`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const o = nd.ownedCoupons.find(x=>x.id===oc.id);
      if(!o) return prev;
      o.status = 'active';
      o.requestedAt = null;
      nd.history.unshift({
        id:uid(), type:'coupon', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`↩ 👨‍🏫 선생님이 ${stu?.name}의 '${c?.name}' 사용 요청 반려`,
        ts: Date.now()
      });
      return nd;
    });
  };
  const stuSummary = data.students.map(s=>{
    const all = (data.ownedCoupons||[]).filter(o=>o.studentId===s.id);
    return {
      ...s,
      active: all.filter(o=>o.status==='active').length,
      pending: all.filter(o=>o.status==='pending').length,
      used: all.filter(o=>o.status==='used').length,
    };
  }).sort((a,b)=>a.number-b.number);

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl shadow p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-lg">🔔 승인 대기 목록 <span className="text-amber-600">({pending.length})</span></h3>
        </div>
        {pending.length===0 ? (
          <div className="text-sm text-gray-400 text-center p-4 bg-gray-50 rounded-lg">승인 대기 중인 요청이 없어요</div>
        ) : (
          <div className="space-y-2">
            {pending.map(oc=>{
              const c = data.coupons.find(x=>x.id===oc.couponId);
              const stu = data.students.find(s=>s.id===oc.studentId);
              return (
                <div key={oc.id} className="p-3 bg-amber-50 border-2 border-amber-300 rounded-xl flex items-center justify-between flex-wrap gap-2">
                  <div className="flex items-center gap-3">
                    <div className="text-3xl">{c?.emoji || '🎁'}</div>
                    <div>
                      <div className="font-bold">{c?.name || '(삭제된 쿠폰)'} <span className="text-xs text-gray-500">· {c?.price}P</span></div>
                      <div className="text-sm text-gray-700">👤 {stu?.name || '(알 수 없음)'} 요청</div>
                      {oc.requestedAt && (
                        <div className="text-xs text-gray-400">요청: {new Date(oc.requestedAt).toLocaleString('ko-KR')}</div>
                      )}
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={()=>approve(oc)}
                      className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-bold">✅ 승인</button>
                    <button onClick={()=>reject(oc)}
                      className="px-4 py-2 bg-red-400 hover:bg-red-500 text-white rounded-lg font-bold">↩ 반려</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl shadow p-4">
        <h3 className="font-bold text-lg mb-3">➕ 새 쿠폰 발행</h3>
        <div className="grid sm:grid-cols-5 gap-2 items-end">
          <label className="sm:col-span-1">
            <div className="text-xs text-gray-500">이모지</div>

              onChange={e=>setForm({...form, emoji:e.target.value})} placeholder="🎁"/>

          <label className="sm:col-span-2">
            <div className="text-xs text-gray-500">쿠폰명</div>
            <input className="w-full border rounded p-2" value={form.name}
              onChange={e=>setForm({...form, name:e.target.value})} placeholder="예: 숙제 면제권"/>
          </label>
          <label className="sm:col-span-1">
            <div className="text-xs text-gray-500">가격 (P)</div>
            <input type="number" className="w-full border rounded p-2" value={form.price}
              onChange={e=>setForm({...form, price:e.target.value})}/>
          </label>
          <button onClick={create}
            className="sm:col-span-1 p-2 bg-violet-600 text-white rounded font-bold">📢 발행</button>
        </div>
        {form.name && (
          <div className="mt-3 max-w-xs mx-auto">
            <div className="text-xs text-gray-500 text-center mb-1">미리보기</div>
            <CouponTicket coupon={{name:form.name, price:parseInt(form.price)||0, emoji:form.emoji}}/>

      <div className="bg-white rounded-2xl shadow p-4">
        <h3 className="font-bold text-lg mb-3">🎟 발행된 쿠폰 ({data.coupons.length}종)</h3>
        {data.coupons.length===0 ? (
          <div className="text-sm text-gray-400 text-center p-4">발행된 쿠폰이 없어요</div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {data.coupons.map(c=>(
              <div key={c.id}>
                <CouponTicket coupon={c}/>
                <div className="mt-2 flex gap-1">
                  <button onClick={()=>setEditing({...c})}

                  <button onClick={()=>remove(c)}

                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl shadow p-4">
        <h3 className="font-bold text-lg mb-3">📊 학생별 쿠폰 현황</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-gray-50">
              <tr>
                <th className="p-2 text-left">번호</th>
                <th className="p-2 text-left">이름</th>
                <th className="p-2 text-right">💰 포인트</th>
                <th className="p-2 text-right">🎫 보유</th>

              {stuSummary.map(s=>(

                  <td className="p-2 font-semibold">{s.name}</td>
                  <td className="p-2 text-right text-emerald-700 font-bold">{s.points||0}P</td>
                  <td className="p-2 text-right">{s.active}</td>

                  <td className="p-2 text-right text-gray-500">{s.used}</td>

            </tbody>

        </div>
      </div>

      <Modal open={!!editing} onClose={()=>setEditing(null)} title="쿠폰 수정">
        {editing && (
          <div className="space-y-3">
            <label className="block">
              <div className="text-xs text-gray-500">이모지</div>

                onChange={e=>setEditing({...editing, emoji:e.target.value})}/>

            <label className="block">
              <div className="text-xs text-gray-500">쿠폰명</div>
              <input className="w-full border rounded p-2" value={editing.name}
                onChange={e=>setEditing({...editing, name:e.target.value})}/>
            </label>
            <label className="block">
              <div className="text-xs text-gray-500">가격 (P)</div>
              <input type="number" className="w-full border rounded p-2" value={editing.price}
                onChange={e=>setEditing({...editing, price:e.target.value})}/>
            </label>
            <div className="flex gap-2">
              <button className="flex-1 p-2 bg-gray-200 rounded-lg" onClick={()=>setEditing(null)}>취소</button>
              <button className="flex-1 p-2 bg-violet-600 text-white rounded-lg font-bold" onClick={saveEdit}>저장</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}
function CouponTab({data, setData, mode, authedStudent}){

function TeacherTools({data, setData}){
  const [tpw,setTpw] = useState('');
  const fileRef = useRef();
  const exportJson = ()=>{
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`class_duty_${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importJson = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const j = JSON.parse(r.result);
        if(!j.students||!j.roles) throw new Error();
        if(!j.layout) j.layout = { cols:8, rows:8, tiles:{} };
        if(!j.coupons) j.coupons = [];
        if(!j.ownedCoupons) j.ownedCoupons = [];
        if(!j.roleRequests) j.roleRequests = {};
        if(!j.passwords) j.passwords = { teacher:'teacher1234', officer:'1234' };
        if(confirm('현재 데이터를 덮어쓸까요?')) setData(j);
      }catch(_){ alert('잘못된 파일이에요'); }
    };
    r.readAsText(f);
  };
  const resetAll = ()=>{
    if(!confirm('정말 모든 기록을 초기화할까요?')) return;
    setData(prev=>({ ...prev, checks:{}, history:[], ownedCoupons:[], roleRequests:{} }));
  };
  const fullReset = ()=>{
    if(!confirm('초기 더미로 되돌릴까요?')) return;
    setData(buildSeed());
  };
  return (
    <div className="bg-white rounded-2xl shadow p-4 space-y-4">
      <h3 className="font-bold text-lg">⚙ 선생님 관리 도구</h3>
      <div className="grid sm:grid-cols-2 gap-3">
        <div className="p-3 bg-violet-50 rounded-xl border border-violet-200">
          <div className="font-semibold mb-2">🔑 비밀번호 변경</div>
          <div className="text-xs text-emerald-700 mb-2">💡 헤더 우측 🔑 PIN 변경 버튼으로 더 빠르게 변경할 수 있어요.</div>
          <div className="space-y-2">
            <div>
              <div className="text-xs text-gray-500">선생님 비번 (현재: <code>{data.passwords.teacher}</code>)</div>
              <div className="flex gap-1">
                <input className="border rounded p-2 flex-1 text-sm" value={tpw} onChange={e=>setTpw(e.target.value)}/>
                <button className="px-2 bg-violet-600 text-white rounded text-sm" onClick={()=>{
                  if(!tpw) return;
                  setData(p=>({...p, passwords:{...p.passwords, teacher:tpw}})); setTpw(''); alert('변경됨');
                }}>변경</button>
              </div>
            </div>
            <div className="text-xs text-gray-500">
              💡 학생 개별 비밀번호는 <b>[👨‍👩‍👧 학생관리]</b> 탭에서 변경할 수 있어요.
            </div>
          </div>
        </div>
        <div className="p-3 bg-amber-50 rounded-xl border border-amber-200">
          <div className="font-semibold mb-2">💾 백업 / 복원 / 초기화</div>
          <div className="flex flex-wrap gap-2">
            <button className="px-3 py-1.5 bg-amber-500 text-white rounded text-sm" onClick={exportJson}>📤 JSON 내보내기</button>
            <button className="px-3 py-1.5 bg-amber-500 text-white rounded text-sm" onClick={()=>fileRef.current.click()}>📥 JSON 불러오기</button>
            <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={importJson}/>
            <button className="px-3 py-1.5 bg-orange-500 text-white rounded text-sm" onClick={resetAll}>♻ 기록 초기화</button>
            <button className="px-3 py-1.5 bg-red-500 text-white rounded text-sm" onClick={fullReset}>🔄 더미로 복원</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [data,setData,syncStatus] = useStore();
  const [mode,setMode] = useState(null);
  const [authedStudent,setAuthedStudent] = useState(null);
  const [tab,setTab] = useState('selfCheck');
  const [date,setDate] = useState(todayStr());
  const [pinOpen, setPinOpen] = useState(false);

  const me = (authedStudent && data)
    ? data.students.find(s=>s.id===authedStudent.id)
    : null;
  const isOfficer = !!(me && me.position && POS[me.position]);
  const officerInfo = isOfficer ? { position: me.position, name: me.name } : null;

  useEffect(()=>{
    if(mode==='student' && authedStudent && data && !me){
      alert('계정 정보를 찾을 수 없어 로그아웃됩니다.');
      handleLogout();
    }
    // eslint-disable-next-line
  },[me, mode, authedStudent, data]);

  useEffect(()=>{
    if(mode==='student' && tab==='approveCheck' && !isOfficer){
      setTab('selfCheck');
    }
  },[isOfficer, tab, mode]);

  const pendingTodayCount = useMemo(()=>{
    if(!data) return 0;
    const reqs = data.roleRequests?.[todayStr()] || {};
    return Object.values(reqs).filter(v=>v.status==='pending').length;
  },[data]);

  const pendingCouponCount = useMemo(()=>{
    if(!data) return 0;
    return (data.ownedCoupons||[]).filter(oc=>oc.status==='pending').length;
  },[data]);

  const handleLogin = ({mode:m, authedStudent:s})=>{
    setMode(m);
    setAuthedStudent(s||null);
    if(m==='student'){
      const initialIsOfficer = !!(s && s.position && POS[s.position]);
      setTab(initialIsOfficer ? 'approveCheck' : 'selfCheck');
    } else if(m==='teacher'){
      setTab('approveCheck');
    }
    setDate(todayStr());
  };
  const handleLogout = ()=>{
    setMode(null);
    setAuthedStudent(null);
    setTab('selfCheck');
    setPinOpen(false);
  };

  const handleOpenPinChange = ()=>{
    // ⭐ 방어: 학생 모드인데 me가 없으면 모달 열기 차단
    if(mode==='student' && !me){
      alert('로그인 정보를 확인할 수 없어요. 다시 로그인해주세요.');
      return;
    }
    setPinOpen(true);
  };

  if(data===null){
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-5xl mb-3 animate-pulse">☁</div>
          <div className="text-lg font-semibold text-gray-700">데이터를 불러오는 중…</div>
        </div>
      </div>
    );
  }

  if(mode===null){
    return <AppGateway data={data} onLogin={handleLogin}/>;
  }

  if(mode==='student' && !me){
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl mb-2">⏳</div>
          <div className="text-sm text-gray-500">계정 정보를 동기화하는 중…</div>
        </div>
      </div>
    );
  }

  const tabs = [];
  if(mode==='student'){
    tabs.push({k:'selfCheck', l:'🙋 내 역할 인증'});
    if(isOfficer){
      tabs.push({k:'approveCheck', l:`🔔 역할 수행 승인${pendingTodayCount>0?` [${pendingTodayCount}]`:''}`});
    }
    tabs.push(
      {k:'check',   l:'✅ 일일 체크'},
      {k:'stats',   l:'📊 통계'},
      {k:'cal',     l:'📆 캘린더'},
      {k:'seat',    l:'🪑 학생 자리'},
      {k:'roles',   l:'📌 역할'},
      {k:'coupon',  l:'🎁 쿠폰'},
      {k:'history', l:'📝 이력'},
    );
  } else {
    tabs.push(
      {k:'approveCheck', l:`🔔 역할 수행 승인${pendingTodayCount>0?` [${pendingTodayCount}]`:''}`},
      {k:'check',   l:'✅ 일일 체크'},
      {k:'stats',   l:'📊 통계'},
      {k:'cal',     l:'📆 캘린더'},
      {k:'seat',    l:'🪑 학생 자리'},
      {k:'roles',   l:'📌 역할'},
      {k:'coupon',  l:`🎁 쿠폰${pendingCouponCount>0 ? ` [${pendingCouponCount}]`:''}`},
      {k:'history', l:'📝 이력'},
      {k:'students', l:'👨‍👩‍👧 학생관리'},
      {k:'tools',    l:'⚙ 도구'},
    );
  }

  return (
    <div className="min-h-screen">
      <Header mode={mode} authedStudent={me} syncStatus={syncStatus}
        onLogout={handleLogout} onOpenPinChange={handleOpenPinChange} />
      <PinChangeModal open={pinOpen} onClose={()=>setPinOpen(false)}
        mode={mode} me={me} data={data} setData={setData} />
      <main className="max-w-6xl mx-auto px-3 sm:px-4 py-4">
        {mode==='student' && (
          <div className="bg-emerald-100 border-l-4 border-emerald-500 p-3 rounded-lg mb-3 text-sm space-y-1">
            <div>🧒 <b>학생 모드</b>입니다. 🙋 내 역할 인증에서 오늘 수행을 신청하고, 🎁 쿠폰 탭에서 포인트로 쿠폰을 구매할 수 있어요.</div>
            {isOfficer && (
              <div>
                🧑‍💼 {POS[me.position].emoji} {POS[me.position].ko} 권한으로 🔔 역할 수행 승인과 📌 역할 명칭 변경을 사용할 수 있어요.
              </div>
            )}
          </div>
        )}
        {mode==='teacher' && (
          <div className="bg-violet-100 border-l-4 border-violet-500 p-3 rounded-lg mb-3 text-sm">
            👨‍🏫 <b>선생님 모드</b>입니다. 승인/반려 + 전 날짜 직접 체크/해제 + 포인트·쿠폰 관리가 가능합니다.
          </div>
        )}
        <div className="flex gap-1 overflow-x-auto scrollbar-soft mb-3 hide-print">
          {tabs.map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)}
              className={`px-3 py-2 rounded-lg whitespace-nowrap font-semibold text-sm
                ${tab===t.k?'bg-white shadow border-2 border-blue-400':'bg-white/60 hover:bg-white border-2 border-transparent'}`}>
              {t.l}

        {tab==='selfCheck' && mode==='student' && me && (
          <SelfCheckTab data={data} setData={setData} authedStudent={me} />

        {tab==='approveCheck' && (

            <ApproveCheckTab data={data} setData={setData} mode={mode}
              officer={mode==='student' ? officerInfo : null} />
          )
        )}
        {tab==='check' && (
          <div className="space-y-3">
            {mode==='teacher' && (
              <div className="bg-white rounded-2xl shadow p-3 flex items-center gap-2 flex-wrap">
                <span className="font-semibold">🗓 체크할 날짜:</span>
                <DatePicker date={date} setDate={setDate}/>
                <button className="px-2 py-1 text-xs bg-gray-100 rounded" onClick={()=>setDate(todayStr())}>오늘</button>
              </div>
            )}
            <CheckList data={data} setData={setData} mode={mode}
              date={mode==='teacher'?date:todayStr()} />
          </div>
        )}
        {tab==='stats'   && <StatsView data={data} setData={setData} mode={mode} />}
        {tab==='cal'     && <CalendarView data={data} />}
        {tab==='seat'    && <SeatLayoutManager data={data} setData={setData} mode={mode} />}
        {tab==='roles'   && (
          (mode==='student' && !isOfficer)
            ? <ReadOnlyRoles data={data} />
            : <RoleManager data={data} setData={setData} mode={mode}
                officer={mode==='student' ? officerInfo : null} />
        )}
        {tab==='coupon'  && <CouponTab data={data} setData={setData} mode={mode} authedStudent={me} />}
        {tab==='history' && <HistoryView data={data} />}
        {tab==='students'&& mode==='teacher' && <StudentManager data={data} setData={setData} />}
        {tab==='tools'   && mode==='teacher' && <TeacherTools data={data} setData={setData} />}
      </main>
      <footer className="text-center text-xs text-gray-400 py-4 hide-print">
        ☁ Firestore 실시간 동기화 · 🔐 학생 단일 로그인 · 🧑‍💼 임원 권한 자동 부여 · 💰 포인트 / 🎁 쿠폰 통합 운영 · 🔑 PIN 셀프 변경
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
