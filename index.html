<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌟 우리 반 1인 1역 체크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#fffaf3;}
  .hide-print{}
  @media print{ .hide-print{display:none!important;} body{background:#fff;} }
  .scrollbar-soft::-webkit-scrollbar{height:8px;width:8px}
  .scrollbar-soft::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   유틸 / 상수
============================================================ */
const POS = {
  president: { ko:'회장',     emoji:'👑', cls:'bg-yellow-200 text-yellow-900 border-yellow-400' },
  maleVP:    { ko:'남부회장', emoji:'💙', cls:'bg-sky-200    text-sky-900    border-sky-400'    },
  femaleVP:  { ko:'여부회장', emoji:'🌸', cls:'bg-pink-200   text-pink-900   border-pink-400'   },
};
const todayStr = (d=new Date()) => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
};
const nowHM = () => {
  const d=new Date(), h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
  const am = h<12?'오전':'오후'; const h12 = ((h+11)%12)+1;
  return `${am} ${h12}:${m}`;
};
const uid = () => Math.random().toString(36).slice(2,9);

/* ============================================================
   초기 더미 데이터
============================================================ */
function buildSeed(){
  const sIds = Array.from({length:6}, ()=>uid());
  const rIds = Array.from({length:6}, ()=>uid());
  const students = [
    { id:sIds[0], name:'김민수', number:1, gender:'M', roleIds:[rIds[0]], position:'maleVP'   },
    { id:sIds[1], name:'박지훈', number:2, gender:'M', roleIds:[rIds[1]], position:null       },
    { id:sIds[2], name:'이준호', number:3, gender:'M', roleIds:[rIds[2]], position:null       },
    { id:sIds[3], name:'이영희', number:4, gender:'F', roleIds:[rIds[3]], position:'femaleVP' },
    { id:sIds[4], name:'최서연', number:5, gender:'F', roleIds:[rIds[4]], position:null       },
    { id:sIds[5], name:'정수아', number:6, gender:'F', roleIds:[rIds[5]], position:'president'},
  ];
  const roles = [
    { id:rIds[0], name:'칠판 정리' },
    { id:rIds[1], name:'우유 당번' },
    { id:rIds[2], name:'분리수거' },
    { id:rIds[3], name:'사물함 정리' },
    { id:rIds[4], name:'화분 물주기' },
    { id:rIds[5], name:'책장 정리' },
  ];
  // 최근 7일치 체크 기록
  const officers = students.filter(s=>s.position).map(s=>({position:s.position, name:s.name}));
  const checks = {};
  const history = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = todayStr(d);
    checks[key] = {};
    students.forEach(s=>{
      // 80% 확률로 체크
      if(Math.random()<0.82){
        const o = officers[Math.floor(Math.random()*officers.length)];
        const hh = 13+Math.floor(Math.random()*4);
        const mm = String(Math.floor(Math.random()*60)).padStart(2,'0');
        const am = hh<12?'오전':'오후'; const h12 = ((hh+11)%12)+1;
        const t = `${am} ${h12}:${mm}`;
        checks[key][s.id] = { checked:true, checkedBy:o, checkedAt:t };
        history.push({
          id:uid(), type:'check', date:key, time:t,
          actor:o, targetStudent:s.name,
          desc:`✅ ${POS[o.position].ko} ${o.name}이(가) ${s.name} 학생 체크`,
          ts: new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,parseInt(mm)).getTime()
        });
      }
    });
  }
  // 항목 수정 이력 샘플
  const t1 = Date.now()-1000*60*60*26;
  history.push({ id:uid(), type:'roleEdit', date:todayStr(new Date(t1)), time:'오후 1:20',
    actor:{position:'maleVP', name:'김민수'},
    desc:`✏️ 남부회장 김민수가 '칠판 닦기' → '칠판 정리'로 명칭 변경`, ts:t1 });
  const t2 = Date.now()-1000*60*60*5;
  history.push({ id:uid(), type:'roleEdit', date:todayStr(new Date(t2)), time:'오전 10:05',
    actor:{position:'president', name:'정수아'},
    desc:`✏️ 회장 정수아가 '우유 당번' 담당자를 박지훈으로 변경`, ts:t2 });
  history.sort((a,b)=>b.ts-a.ts);
  return {
    students, roles, checks, history,
    passwords:{ teacher:'teacher1234', officer:'1234' },
    version:1
  };
}

/* ============================================================
   localStorage 훅
============================================================ */
const LS_KEY = 'classDuty_v1';
function useStore(){
  const [data,setData] = useState(()=>{
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return buildSeed();
  });
  useEffect(()=>{ localStorage.setItem(LS_KEY, JSON.stringify(data)); },[data]);
  return [data,setData];
}

/* ============================================================
   공통 컴포넌트
============================================================ */
function Badge({position, name, big=false}){
  const p = POS[position];
  if(!p) return null;
  return (
    <span className={`inline-flex items-center gap-1 px-2 py-1 rounded-full border ${p.cls} ${big?'text-base font-bold':'text-xs font-semibold'}`}>
      <span>{p.emoji}</span><span>{p.ko}</span>{name && <span>{name}</span>}
    </span>
  );
}

function Modal({open,onClose,title,children,wide=false}){
  if(!open) return null;
  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hide-print" onClick={onClose}>
      <div className={`bg-white rounded-2xl shadow-xl w-full ${wide?'max-w-3xl':'max-w-md'} p-5`} onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-3">
          <h3 className="text-lg font-bold">{title}</h3>
          <button className="text-2xl text-gray-400 hover:text-gray-700" onClick={onClose}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   상단 헤더 / 모드 표시
============================================================ */
function Header({mode, officer, onSwitch, onLogout}){
  let theme = 'bg-emerald-500';   // 학생
  let label = '🧒 학생 모드';
  if(mode==='teacher'){ theme='bg-violet-600'; label='👨‍🏫 선생님 모드'; }
  if(mode==='officer'){ theme='bg-blue-600'; label='🧑‍💼 학급임원 모드'; }
  return (
    <header className={`${theme} text-white shadow-md hide-print`}>
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="text-2xl font-extrabold">🌟 우리 반 1인 1역</div>
          <span className="px-3 py-1 rounded-full bg-white/20 text-sm font-semibold">{label}</span>
          {mode==='officer' && officer && (
            <Badge position={officer.position} name={officer.name} big />
          )}
        </div>
        <div className="flex items-center gap-2">
          {mode!=='student' && (
            <button onClick={onLogout} className="px-3 py-1.5 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">로그아웃</button>
          )}
          <button onClick={onSwitch} className="px-3 py-1.5 bg-white text-gray-800 hover:bg-gray-100 rounded-lg text-sm font-bold">🔁 모드 전환</button>
        </div>
      </div>
      {mode==='officer' && officer && (
        <div className="bg-white/10 text-center py-1.5 text-sm">
          🧑‍💼 <b>{POS[officer.position].ko} {officer.name}</b> 님, 오늘도 수고하세요! 💪
        </div>
      )}
    </header>
  );
}

/* ============================================================
   모드 전환 모달
============================================================ */
function SwitchModal({open,onClose,data,onPick}){
  const [step,setStep] = useState('choose'); // choose | tpw | opw | opick
  const [pw,setPw] = useState('');
  const [err,setErr] = useState('');
  useEffect(()=>{ if(open){ setStep('choose'); setPw(''); setErr(''); } },[open]);
  const officers = data.students.filter(s=>s.position);

  return (
    <Modal open={open} onClose={onClose} title="모드 선택">
      {step==='choose' && (
        <div className="grid grid-cols-1 gap-3">
          <button onClick={()=>{ onPick({mode:'student'}); onClose(); }}
            className="p-4 rounded-xl bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-300 text-left">
            <div className="text-2xl">🧒 학생 모드</div>
            <div className="text-sm text-gray-600">비밀번호 없이 결과를 볼 수 있어요</div>
          </button>
          <button onClick={()=>setStep('opw')}
            className="p-4 rounded-xl bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 text-left">
            <div className="text-2xl">🧑‍💼 학급임원 모드</div>
            <div className="text-sm text-gray-600">공용 비밀번호로 들어가 체크해요</div>
          </button>
          <button onClick={()=>setStep('tpw')}
            className="p-4 rounded-xl bg-violet-100 hover:bg-violet-200 border-2 border-violet-300 text-left">
            <div className="text-2xl">👨‍🏫 선생님 모드</div>
            <div className="text-sm text-gray-600">전체를 관리할 수 있어요</div>
          </button>
        </div>
      )}
      {(step==='tpw'||step==='opw') && (
        <div>
          <div className="mb-2 font-semibold">{step==='tpw'?'👨‍🏫 선생님 비밀번호':'🧑‍💼 학급임원 공용 비밀번호'}</div>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
            className="w-full border-2 rounded-lg p-3 text-lg focus:border-blue-500 outline-none"
            placeholder="비밀번호를 입력하세요" autoFocus
            onKeyDown={e=>{ if(e.key==='Enter') document.getElementById('pwOk').click(); }} />
          {err && <div className="text-red-500 mt-2 text-sm">{err}</div>}
          <div className="flex gap-2 mt-3">
            <button className="flex-1 p-2.5 bg-gray-200 rounded-lg" onClick={()=>setStep('choose')}>← 뒤로</button>
            <button id="pwOk" className="flex-1 p-2.5 bg-blue-600 text-white rounded-lg font-bold"
              onClick={()=>{
                if(step==='tpw'){
                  if(pw===data.passwords.teacher){ onPick({mode:'teacher'}); onClose(); }
                  else setErr('비밀번호가 틀렸어요');
                } else {
                  if(pw===data.passwords.officer){ setStep('opick'); setErr(''); }
                  else setErr('비밀번호가 틀렸어요');
                }
              }}>확인</button>
          </div>
        </div>
      )}
      {step==='opick' && (
        <div>
          <div className="mb-2 font-semibold">누구인지 선택해주세요</div>
          <div className="grid gap-2">
            {officers.length===0 && <div className="text-gray-500">지정된 학급임원이 없어요. 선생님께 문의하세요.</div>}
            {officers.map(o=>(
              <button key={o.id}
                className="p-3 rounded-xl border-2 hover:bg-gray-50 text-left flex items-center gap-3"
                onClick={()=>{ onPick({mode:'officer', officer:{position:o.position, name:o.name}}); onClose(); }}>
                <Badge position={o.position} />
                <span className="text-lg font-bold">{o.name}</span>
              </button>
            ))}
          </div>
          <button className="mt-3 w-full p-2 bg-gray-200 rounded-lg" onClick={()=>setStep('choose')}>← 뒤로</button>
        </div>
      )}
    </Modal>
  );
}

/* ============================================================
   체크 리스트 (오늘/특정 날짜)
============================================================ */
function CheckList({data, setData, mode, officer, date, onCheckLogged}){
  const isToday = date === todayStr();
  const canCheck = mode==='teacher' || (mode==='officer' && isToday);
  const dayChecks = data.checks[date] || {};

  const toggle = (sid)=>{
    if(!canCheck) return;
    const cur = dayChecks[sid];
    setData(prev=>{
      const nd = structuredClone(prev);
      if(!nd.checks[date]) nd.checks[date] = {};
      if(cur && cur.checked){
        delete nd.checks[date][sid];
        nd.history.unshift({
          id:uid(), type:'uncheck', date, time:nowHM(),
          actor: mode==='teacher'?{position:'teacher',name:'선생님'}:officer,
          desc: `↩️ ${mode==='teacher'?'선생님':POS[officer.position].ko+' '+officer.name}이(가) ${nd.students.find(s=>s.id===sid)?.name} 체크 해제 (${date})`,
          ts: Date.now()
        });
      } else {
        const by = mode==='teacher'?{position:'teacher',name:'선생님'}:officer;
        nd.checks[date][sid] = { checked:true, checkedBy:by, checkedAt:nowHM() };
        nd.history.unshift({
          id:uid(), type:'check', date, time:nowHM(),
          actor:by, targetStudent: nd.students.find(s=>s.id===sid)?.name,
          desc: `✅ ${by.position==='teacher'?'👨‍🏫 선생님':POS[by.position].ko+' '+by.name}이(가) ${nd.students.find(s=>s.id===sid)?.name} 체크 (${date})`,
          ts: Date.now()
        });
      }
      return nd;
    });
    onCheckLogged && onCheckLogged();
  };

  const sorted = [...data.students].sort((a,b)=>a.number-b.number);
  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
        <h2 className="text-xl font-bold">📅 {date} {isToday && <span className="ml-1 text-sm bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">오늘</span>}</h2>
        <div className="text-sm text-gray-500">
          {canCheck ? '✏️ 체크/해제 가능' : (mode==='officer' ? '🔒 과거 날짜는 조회만 가능' : '👁️ 읽기 전용')}
        </div>
      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
        {sorted.map(s=>{
          const c = dayChecks[s.id];
          const isChecked = !!(c && c.checked);
          const roleNames = s.roleIds.map(rid=>data.roles.find(r=>r.id===rid)?.name).filter(Boolean).join(', ');
          return (
            <div key={s.id}
              onClick={()=>toggle(s.id)}
              className={`p-3 rounded-xl border-2 transition cursor-pointer ${isChecked?'bg-emerald-50 border-emerald-400':'bg-gray-50 border-gray-200'} ${!canCheck?'cursor-default':'hover:shadow'}`}>
              <div className="flex items-start justify-between gap-2">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1 flex-wrap">
                    <span className="text-xs text-gray-500">{s.number}번</span>
                    <span className="font-bold text-lg truncate">{s.name}</span>
                    <span className="text-xs">{s.gender==='M'?'👦':'👧'}</span>
                    {s.position && <Badge position={s.position} />}
                  </div>
                  <div className="text-sm text-gray-600 truncate" title={roleNames}>📌 {roleNames || '역할 없음'}</div>
                  {c && (
                    <div className="text-xs text-gray-500 mt-1">
                      {c.checkedBy.position==='teacher' ? '👨‍🏫 선생님' : `${POS[c.checkedBy.position].emoji} ${POS[c.checkedBy.position].ko} ${c.checkedBy.name}`} 체크 ({c.checkedAt})
                    </div>
                  )}
                </div>
                <div className={`text-3xl select-none ${isChecked?'':'opacity-30'}`}>{isChecked?'✅':'⬜'}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   통계 카드 / 성실왕
============================================================ */
function StatsView({data, defaultMonth}){
  // 기본 범위: defaultMonth가 있는 달의 1일 ~ 오늘(또는 그 달 말일)
  const initialRange = useMemo(()=>{
    const [y,m] = (defaultMonth||todayStr().slice(0,7)).split('-').map(Number);
    const first = `${y}-${String(m).padStart(2,'0')}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    const last = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    const today = todayStr();
    return { start: first, end: today<last && today>=first ? today : last };
  },[defaultMonth]);

  const [range,setRange] = useState(initialRange);
  const [preset,setPreset] = useState('thisMonth');

  // 프리셋 적용
  const applyPreset = (key)=>{
    const today = new Date();
    const t = todayStr();
    let s, e;
    if(key==='today'){ s=t; e=t; }
    else if(key==='thisWeek'){
      const dow = today.getDay(); // 0(일)~6(토)
      const mon = new Date(today); mon.setDate(today.getDate()-((dow+6)%7));
      s = todayStr(mon); e = t;
    }
    else if(key==='last7'){
      const d = new Date(today); d.setDate(today.getDate()-6);
      s = todayStr(d); e = t;
    }
    else if(key==='thisMonth'){
      s = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
      e = t;
    }
    else if(key==='lastMonth'){
      const y = today.getMonth()===0?today.getFullYear()-1:today.getFullYear();
      const m = today.getMonth()===0?12:today.getMonth();
      const lastDay = new Date(y, m, 0).getDate();
      s = `${y}-${String(m).padStart(2,'0')}-01`;
      e = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    }
    else if(key==='last30'){
      const d = new Date(today); d.setDate(today.getDate()-29);
      s = todayStr(d); e = t;
    }
    else if(key==='allTime'){
      const keys = Object.keys(data.checks).sort();
      s = keys[0] || t; e = t;
    }
    setRange({start:s, end:e});
    setPreset(key);
  };

  const updateRange = (k,v)=>{
    setPreset('custom');
    setRange(prev=>{
      const next = {...prev, [k]:v};
      // start>end 방지
      if(next.start>next.end){
        if(k==='start') next.end = next.start;
        else next.start = next.end;
      }
      return next;
    });
  };

  // 통계 계산
  const stats = useMemo(()=>{
    const dates = Object.keys(data.checks).filter(d=> d>=range.start && d<=range.end ).sort();
    // 범위 내 "전체 일수"는 달력 일수로 계산 (체크 기록 없는 날도 분모에 포함하면 의미가 왜곡되므로
    //  여기서는 '체크 기록이 있는 날'의 수를 분모로 사용 — 기존 로직 유지)
    const total = dates.length || 1;
    const perStudent = data.students.map(s=>{
      const done = dates.filter(d=> data.checks[d]?.[s.id]?.checked ).length;
      const rate = Math.round(done/total*100);
      return { ...s, done, rate, totalDays:dates.length };
    });
    const avg = perStudent.length ? Math.round(perStudent.reduce((a,b)=>a+b.rate,0)/perStudent.length) : 0;
    return { perStudent, avg, totalDays:dates.length };
  },[data, range]);

  const perfectStudents = stats.totalDays>0
    ? stats.perStudent.filter(s=>s.rate===100).sort((a,b)=>a.number-b.number)
    : [];

  const colorOf = r => r>=90?'bg-emerald-100 text-emerald-700 border-emerald-300'
                       : r>=70?'bg-yellow-100 text-yellow-700 border-yellow-300'
                       : 'bg-red-100 text-red-700 border-red-300';
  const dotOf = r => r>=90?'🟢':r>=70?'🟡':'🔴';

  const rangeLabel = range.start===range.end
    ? range.start
    : `${range.start} ~ ${range.end}`;

  const presets = [
    ['today','오늘'],
    ['thisWeek','이번 주'],
    ['last7','최근 7일'],
    ['thisMonth','이번 달'],
    ['lastMonth','지난 달'],
    ['last30','최근 30일'],
    ['allTime','전체'],
  ];

  return (
    <div className="space-y-4">
      {/* 날짜 범위 선택기 */}
      <div className="bg-white rounded-2xl shadow p-4">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div className="font-bold text-lg">📅 통계 기간 설정</div>

/* ============================================================
   캘린더 뷰
============================================================ */
function CalendarView({data}){
  const [cur,setCur] = useState(()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; });
  const [picked,setPicked] = useState(todayStr());
  const first = new Date(cur.y, cur.m, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  const monthKey = `${cur.y}-${String(cur.m+1).padStart(2,'0')}`;
  const dayChecks = data.checks[picked] || {};
  const checkedStudents = Object.entries(dayChecks).filter(([_,v])=>v.checked)
    .map(([sid,v])=>({ student: data.students.find(s=>s.id===sid), info:v }))
    .filter(x=>x.student);

  const move = (delta)=>{
    let m=cur.m+delta, y=cur.y;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setCur({y,m});
  };

  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-3">
        <button className="px-3 py-1 bg-gray-100 rounded-lg" onClick={()=>move(-1)}>◀</button>
        <h3 className="font-bold text-lg">📆 {cur.y}년 {cur.m+1}월</h3>
        <button className="px-3 py-1 bg-gray-100 rounded-lg" onClick={()=>move(1)}>▶</button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-gray-500 mb-1">
        {['일','월','화','수','목','금','토'].map(d=><div key={d}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((d,i)=>{
          if(!d) return <div key={i} />;
          const key = `${cur.y}-${String(cur.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const cnt = Object.values(data.checks[key]||{}).filter(v=>v.checked).length;
          const isPick = picked===key;
          const isToday = key===todayStr();
          return (
            <button key={i} onClick={()=>setPicked(key)}
              className={`aspect-square rounded-lg border-2 text-sm flex flex-col items-center justify-center
                ${isPick?'border-blue-500 bg-blue-50':'border-transparent hover:bg-gray-50'}
                ${isToday?'ring-2 ring-emerald-400':''}`}>
              <div className="font-bold">{d}</div>
              {cnt>0 && <div className="text-[10px] text-emerald-700">✅ {cnt}</div>}
            </button>
          );
        })}
      </div>
      <div className="mt-4 border-t pt-3">
        <div className="font-semibold mb-2">📌 {picked} 수행 현황 ({checkedStudents.length}명)</div>
        {checkedStudents.length===0 ? (
          <div className="text-sm text-gray-400">기록이 없어요</div>
        ) : (
          <ul className="space-y-1 text-sm max-h-48 overflow-auto">
            {checkedStudents.map((x,i)=>(
              <li key={i} className="flex items-center gap-2">
                <span>✅</span>
                <b>{x.student.name}</b>
                <span className="text-gray-400">·</span>
                <span className="text-xs text-gray-600">
                  {x.info.checkedBy.position==='teacher' ? '👨‍🏫 선생님' : `${POS[x.info.checkedBy.position].emoji} ${POS[x.info.checkedBy.position].ko} ${x.info.checkedBy.name}`}
                </span>
                <span className="text-xs text-gray-400">({x.info.checkedAt})</span>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   1인 1역 항목 관리 (수정: 임원+선생, 추가/삭제: 선생님만)
============================================================ */
function RoleManager({data, setData, mode, officer}){
  const canEdit = true; // mode가 student면 호출 안됨
  const isTeacher = mode==='teacher';
  const [newName,setNewName] = useState('');

  const editName = (rid,oldName)=>{
    const v = prompt(`'${oldName}' 새 이름을 입력하세요`, oldName);
    if(!v || v===oldName) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      const r = nd.roles.find(x=>x.id===rid); if(!r) return prev;
      r.name = v;
      const actor = isTeacher?{position:'teacher',name:'선생님'}:officer;
      nd.history.unshift({
        id:uid(), type:'roleEdit', date:todayStr(), time:nowHM(), actor,
        desc:`✏️ ${actor.position==='teacher'?'👨‍🏫 선생님':POS[actor.position].ko+' '+actor.name}이(가) '${oldName}' → '${v}' 명칭 변경`,
        ts:Date.now()
      });
      return nd;
    });
  };

  const changeAssignee = (rid,roleName)=>{
    const sid = prompt('새로운 담당자의 번호를 입력하세요 (숫자)');
    if(!sid) return;
    const num = parseInt(sid);
    setData(prev=>{
      const nd = structuredClone(prev);
      const target = nd.students.find(s=>s.number===num);
      if(!target){ alert('해당 번호의 학생이 없어요'); return prev; }
      // 기존 담당자에서 제거
      nd.students.forEach(s=>{ s.roleIds = s.roleIds.filter(x=>x!==rid); });
      target.roleIds.push(rid);
      const actor = isTeacher?{position:'teacher',name:'선생님'}:officer;
      nd.history.unshift({
        id:uid(), type:'roleEdit', date:todayStr(), time:nowHM(), actor,
        desc:`✏️ ${actor.position==='teacher'?'👨‍🏫 선생님':POS[actor.position].ko+' '+actor.name}이(가) '${roleName}' 담당자를 ${target.name}으로 변경`,
        ts:Date.now()
      });
      return nd;
    });
  };

  const addRole = ()=>{
    if(!isTeacher) return;
    if(!newName.trim()) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.roles.push({id:uid(), name:newName.trim()});
      nd.history.unshift({ id:uid(), type:'roleEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`➕ 👨‍🏫 선생님이 새 역할 '${newName.trim()}' 추가`, ts:Date.now() });
      return nd;
    });
    setNewName('');
  };
  const removeRole = (rid,name)=>{
    if(!isTeacher) return;
    if(!confirm(`'${name}' 역할을 삭제할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.roles = nd.roles.filter(r=>r.id!==rid);
      nd.students.forEach(s=>{ s.roleIds = s.roleIds.filter(x=>x!==rid); });
      nd.history.unshift({ id:uid(), type:'roleEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🗑️ 👨‍🏫 선생님이 역할 '${name}' 삭제`, ts:Date.now() });
      return nd;
    });
  };

  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <h3 className="font-bold text-lg mb-2">📌 1인 1역 항목</h3>
      <p className="text-xs text-gray-500 mb-3">
        {isTeacher ? '추가·수정·삭제 모두 가능' : '명칭/담당자 수정만 가능 (추가·삭제는 선생님 권한)'}
      </p>
      <ul className="space-y-2">
        {data.roles.map(r=>{
          const owners = data.students.filter(s=>s.roleIds.includes(r.id)).map(s=>s.name).join(', ') || '없음';
          return (
            <li key={r.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg gap-2 flex-wrap">
              <div>
                <div className="font-semibold">{r.name}</div>
                <div className="text-xs text-gray-500">담당: {owners}</div>
              </div>
              <div className="flex gap-1 flex-wrap">
                <button className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded" onClick={()=>editName(r.id,r.name)}>✏️ 명칭</button>
                <button className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded" onClick={()=>changeAssignee(r.id,r.name)}>👤 담당자</button>
                {isTeacher && <button className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded" onClick={()=>removeRole(r.id,r.name)}>🗑️ 삭제</button>}
              </div>
            </li>
          );
        })}
      </ul>
      {isTeacher && (
        <div className="mt-3 flex gap-2">
          <input className="flex-1 border rounded-lg p-2" placeholder="새 역할 이름" value={newName} onChange={e=>setNewName(e.target.value)} />
          <button className="px-3 py-2 bg-violet-600 text-white rounded-lg font-semibold" onClick={addRole}>➕ 추가</button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   학생 관리 (선생님 전용)
============================================================ */
function StudentManager({data, setData}){
  const [editing,setEditing] = useState(null);

  const newStudent = ()=>setEditing({id:null, name:'', number:data.students.length+1, gender:'M', roleIds:[], position:null});

  const save = ()=>{
    if(!editing.name.trim()){ alert('이름을 입력하세요'); return; }
    setData(prev=>{
      const nd = structuredClone(prev);
      // 직책 중복 검증
      if(editing.position){
        nd.students.forEach(s=>{ if(s.id!==editing.id && s.position===editing.position) s.position=null; });
      }
      // 성별 검증
      if(editing.position==='maleVP' && editing.gender!=='M'){ alert('남부회장은 남학생만 가능'); return prev; }
      if(editing.position==='femaleVP' && editing.gender!=='F'){ alert('여부회장은 여학생만 가능'); return prev; }
      if(editing.id){
        const idx = nd.students.findIndex(s=>s.id===editing.id);
        nd.students[idx] = editing;
      } else {
        nd.students.push({...editing, id:uid()});
      }
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`👤 👨‍🏫 선생님이 '${editing.name}' 학생 정보 ${editing.id?'수정':'추가'}`, ts:Date.now() });
      return nd;
    });
    setEditing(null);
  };

  const remove = (s)=>{
    if(!confirm(`'${s.name}' 학생을 삭제할까요?`)) return;
    setData(prev=>{
      const nd = structuredClone(prev);
      nd.students = nd.students.filter(x=>x.id!==s.id);
      Object.keys(nd.checks).forEach(d=>{ delete nd.checks[d][s.id]; });
      nd.history.unshift({ id:uid(), type:'studentEdit', date:todayStr(), time:nowHM(),
        actor:{position:'teacher',name:'선생님'},
        desc:`🗑️ 👨‍🏫 선생님이 '${s.name}' 학생 삭제`, ts:Date.now() });
      return nd;
    });
  };

  const sorted = [...data.students].sort((a,b)=>a.number-b.number);
  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-2">
        <h3 className="font-bold text-lg">👨‍👩‍👧 학생 명단</h3>
        <button className="px-3 py-1.5 bg-violet-600 text-white rounded-lg text-sm font-semibold" onClick={newStudent}>➕ 학생 추가</button>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-gray-50">
            <tr>
              <th className="p-2 text-left">번호</th>
              <th className="p-2 text-left">이름</th>
              <th className="p-2 text-left">성별</th>
              <th className="p-2 text-left">직책</th>
              <th className="p-2 text-left">담당 역할</th>
              <th className="p-2"></th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(s=>(
              <tr key={s.id} className="border-t">
                <td className="p-2">{s.number}</td>
                <td className="p-2 font-semibold">{s.name}</td>
                <td className="p-2">{s.gender==='M'?'👦 남':'👧 여'}</td>
                <td className="p-2">{s.position?<Badge position={s.position}/>:<span className="text-gray-400">없음</span>}</td>
                <td className="p-2">{s.roleIds.map(rid=>data.roles.find(r=>r.id===rid)?.name).filter(Boolean).join(', ') || '-'}</td>
                <td className="p-2 text-right whitespace-nowrap">
                  <button className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded mr-1" onClick={()=>setEditing({...s})}>✏️</button>
                  <button className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded" onClick={()=>remove(s)}>🗑️</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Modal open={!!editing} onClose={()=>setEditing(null)} title={editing?.id?'학생 수정':'학생 추가'} wide>
        {editing && (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-2">
              <label className="block">
                <div className="text-xs text-gray-500">번호</div>
                <input type="number" className="border rounded p-2 w-full" value={editing.number} onChange={e=>setEditing({...editing, number:parseInt(e.target.value)||0})}/>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">이름</div>
                <input className="border rounded p-2 w-full" value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})}/>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">성별</div>
                <select className="border rounded p-2 w-full" value={editing.gender} onChange={e=>{
                  const g=e.target.value; let p=editing.position;
                  if(p==='maleVP'&&g!=='M') p=null; if(p==='femaleVP'&&g!=='F') p=null;
                  setEditing({...editing, gender:g, position:p});
                }}>
                  <option value="M">👦 남</option>
                  <option value="F">👧 여</option>
                </select>
              </label>
              <label className="block">
                <div className="text-xs text-gray-500">학급임원 직책</div>
                <select className="border rounded p-2 w-full" value={editing.position||''} onChange={e=>setEditing({...editing, position:e.target.value||null})}>
                  <option value="">없음</option>
                  <option value="president">👑 회장</option>
                  {editing.gender==='M' && <option value="maleVP">💙 남부회장</option>}
                  {editing.gender==='F' && <option value="femaleVP">🌸 여부회장</option>}
                </select>
              </label>
            </div>
            <div>
              <div className="text-xs text-gray-500 mb-1">담당 역할 (여러 개 선택 가능)</div>
              <div className="flex flex-wrap gap-1">
                {data.roles.map(r=>{
                  const on = editing.roleIds.includes(r.id);
                  return (
                    <button key={r.id} type="button"
                      onClick={()=>setEditing({...editing, roleIds: on?editing.roleIds.filter(x=>x!==r.id):[...editing.roleIds,r.id]})}
                      className={`px-2 py-1 text-sm rounded-full border ${on?'bg-violet-600 text-white border-violet-600':'bg-gray-50'}`}>
                      {on?'✓ ':''}{r.name}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="flex-1 p-2 bg-gray-200 rounded-lg" onClick={()=>setEditing(null)}>취소</button>
              <button className="flex-1 p-2 bg-violet-600 text-white rounded-lg font-bold" onClick={save}>저장</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   선생님 관리 패널 (비번 변경, 백업/복원, 초기화, 리포트)
============================================================ */
function TeacherTools({data, setData}){
  const [tpw,setTpw] = useState('');
  const [opw,setOpw] = useState('');
  const fileRef = useRef();

  const exportJson = ()=>{
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`class_duty_${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importJson = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const j = JSON.parse(r.result);
        if(!j.students||!j.roles) throw new Error();
        if(confirm('현재 데이터를 덮어쓸까요?')) setData(j);
      }catch(_){ alert('잘못된 파일이에요'); }
    };
    r.readAsText(f);
  };
  const resetAll = ()=>{
    if(!confirm('정말 모든 데이터를 초기화할까요? (학기/학년 초 리셋)')) return;
    if(!confirm('체크 기록과 이력이 모두 사라집니다. 진행할까요?')) return;
    setData(prev=>({ ...prev, checks:{}, history:[] }));
    alert('체크 기록과 이력이 초기화됐어요. 학생/역할은 유지됩니다.');
  };
  const fullReset = ()=>{
    if(!confirm('학생/역할/기록 모두 초기 더미 데이터로 되돌릴까요?')) return;
    setData(buildSeed());
  };
  const exportPng = async ()=>{
    const el = document.getElementById('report-area');
    if(!el){ alert('리포트 영역이 없습니다. 통계 탭으로 가세요.'); return; }
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2});
    canvas.toBlob(b=>{
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href=url; a.download=`report_${todayStr()}.png`; a.click();
      URL.revokeObjectURL(url);
    });
  };

  return (
    <div className="bg-white rounded-2xl shadow p-4 space-y-4">
      <h3 className="font-bold text-lg">⚙️ 선생님 관리 도구</h3>

      <div className="grid sm:grid-cols-2 gap-3">
        <div className="p-3 bg-violet-50 rounded-xl border border-violet-200">
          <div className="font-semibold mb-2">🔑 비밀번호 변경</div>
          <div className="space-y-2">
            <div>
              <div className="text-xs text-gray-500">선생님 비밀번호 (현재: <code>{data.passwords.teacher}</code>)</div>
              <div className="flex gap-1">
                <input className="border rounded p-2 flex-1 text-sm" value={tpw} onChange={e=>setTpw(e.target.value)} placeholder="새 비밀번호"/>
                <button className="px-2 bg-violet-600 text-white rounded text-sm" onClick={()=>{
                  if(!tpw) return;
                  setData(p=>({...p, passwords:{...p.passwords, teacher:tpw}})); setTpw(''); alert('변경됨');
                }}>변경</button>
              </div>
            </div>
            <div>
              <div className="text-xs text-gray-500">학급임원 공용 비밀번호 (현재: <code>{data.passwords.officer}</code>)</div>
              <div className="flex gap-1">
                <input className="border rounded p-2 flex-1 text-sm" value={opw} onChange={e=>setOpw(e.target.value)} placeholder="새 비밀번호"/>
                <button className="px-2 bg-violet-600 text-white rounded text-sm" onClick={()=>{
                  if(!opw) return;
                  setData(p=>({...p, passwords:{...p.passwords, officer:opw}})); setOpw(''); alert('변경됨');
                }}>변경</button>
              </div>
            </div>
          </div>
        </div>

        <div className="p-3 bg-amber-50 rounded-xl border border-amber-200">
          <div className="font-semibold mb-2">💾 백업 / 복원 / 초기화</div>
          <div className="flex flex-wrap gap-2">
            <button className="px-3 py-1.5 bg-amber-500 text-white rounded text-sm" onClick={exportJson}>📤 JSON 내보내기</button>
            <button className="px-3 py-1.5 bg-amber-500 text-white rounded text-sm" onClick={()=>fileRef.current.click()}>📥 JSON 불러오기</button>
            <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={importJson}/>
            <button className="px-3 py-1.5 bg-orange-500 text-white rounded text-sm" onClick={resetAll}>♻️ 기록 초기화</button>
            <button className="px-3 py-1.5 bg-red-500 text-white rounded text-sm" onClick={fullReset}>🔄 더미로 복원</button>
          </div>
        </div>

        <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 sm:col-span-2">
          <div className="font-semibold mb-2">📄 리포트 내보내기</div>
          <p className="text-xs text-gray-600 mb-2">📊 통계 탭의 학생별 수행률 영역을 이미지(PNG)로 저장하거나, 프린트해서 PDF로 저장할 수 있어요.</p>
          <div className="flex gap-2 flex-wrap">
            <button className="px-3 py-1.5 bg-emerald-600 text-white rounded text-sm" onClick={exportPng}>🖼️ PNG로 저장</button>
            <button className="px-3 py-1.5 bg-emerald-600 text-white rounded text-sm" onClick={()=>window.print()}>🖨️ 프린트 / PDF</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   날짜 선택 (선생님 전용 - 과거 체크 정정)
============================================================ */
function DatePicker({date,setDate}){
  return (
    <input type="date" value={date} onChange={e=>setDate(e.target.value||todayStr())}
      className="border-2 rounded-lg p-2 text-sm" />
  );
}

/* ============================================================
   메인 App
============================================================ */
function App(){
  const [data,setData] = useStore();
  const [mode,setMode] = useState('student');
  const [officer,setOfficer] = useState(null);
  const [tab,setTab] = useState('check');
  const [switchOpen,setSwitchOpen] = useState(false);
  const [date,setDate] = useState(todayStr());
  const monthKey = date.slice(0,7);

  const tabs = [
    {k:'check', l:'✅ 일일 체크'},
    {k:'stats', l:'📊 통계'},
    {k:'cal',   l:'📆 캘린더'},
    {k:'roles', l:'📌 역할'},
    {k:'history', l:'📝 이력'},
  ];
  if(mode==='teacher'){
    tabs.push({k:'students', l:'👨‍👩‍👧 학생관리'});
    tabs.push({k:'tools', l:'⚙️ 도구'});
  }

  return (
    <div className="min-h-screen">
      <Header mode={mode} officer={officer}
        onSwitch={()=>setSwitchOpen(true)}
        onLogout={()=>{ setMode('student'); setOfficer(null); setTab('check'); }} />
      <SwitchModal open={switchOpen} onClose={()=>setSwitchOpen(false)} data={data}
        onPick={({mode,officer})=>{ setMode(mode); setOfficer(officer||null); setTab('check'); setDate(todayStr()); }} />

      <main className="max-w-6xl mx-auto px-3 sm:px-4 py-4">
        {/* 모드별 안내 박스 */}
        {mode==='student' && (
          <div className="bg-emerald-100 border-l-4 border-emerald-500 p-3 rounded-lg mb-3 text-sm">
            🧒 <b>학생 모드</b>입니다. 친구들의 1인 1역 수행 현황을 자유롭게 둘러볼 수 있어요. 체크는 학급임원/선생님만 할 수 있습니다.
          </div>
        )}
        {mode==='officer' && (
          <div className="bg-blue-100 border-l-4 border-blue-500 p-3 rounded-lg mb-3 text-sm">
            🧑‍💼 <b>학급임원 모드</b>입니다. <u>오늘 날짜</u>에만 체크할 수 있어요. 모든 동작은 자동으로 기록됩니다.
          </div>
        )}
        {mode==='teacher' && (
          <div className="bg-violet-100 border-l-4 border-violet-500 p-3 rounded-lg mb-3 text-sm">
            👨‍🏫 <b>선생님 모드</b>입니다. 모든 권한을 사용할 수 있어요 (과거 기록 정정, 학생/역할/비밀번호 관리, 백업).
          </div>
        )}

        {/* 탭 */}
        <div className="flex gap-1 overflow-x-auto scrollbar-soft mb-3 hide-print">
          {tabs.map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)}
              className={`px-3 py-2 rounded-lg whitespace-nowrap font-semibold text-sm
                ${tab===t.k?'bg-white shadow border-2 border-blue-400':'bg-white/60 hover:bg-white border-2 border-transparent'}`}>
              {t.l}
            </button>
          ))}
        </div>

        {/* 탭 내용 */}
        {tab==='check' && (
          <div className="space-y-3">
            {mode==='teacher' && (
              <div className="bg-white rounded-2xl shadow p-3 flex items-center gap-2 flex-wrap">
                <span className="font-semibold">🗓️ 체크할 날짜:</span>
                <DatePicker date={date} setDate={setDate}/>
                <button className="px-2 py-1 text-xs bg-gray-100 rounded" onClick={()=>setDate(todayStr())}>오늘</button>
                <span className="text-xs text-gray-500">선생님은 모든 날짜를 정정할 수 있어요</span>
              </div>
            )}
            <CheckList data={data} setData={setData} mode={mode} officer={officer}
              date={mode==='teacher'?date:todayStr()} />
          </div>
        )}
        {tab==='stats'   && <StatsView data={data} defaultMonth={monthKey} />}
        {tab==='cal'     && <CalendarView data={data} />}
        {tab==='roles'   && (mode==='student'
          ? <ReadOnlyRoles data={data} />
          : <RoleManager data={data} setData={setData} mode={mode} officer={officer} />)}
        {tab==='history' && <HistoryView data={data} />}
        {tab==='students'&& mode==='teacher' && <StudentManager data={data} setData={setData} />}
        {tab==='tools'   && mode==='teacher' && <TeacherTools data={data} setData={setData} />}
      </main>

      <footer className="text-center text-xs text-gray-400 py-4 hide-print">
        💾 데이터는 이 브라우저에만 저장됩니다 · 브라우저/기기를 바꾸면 선생님 메뉴의 JSON 내보내기/불러오기를 활용하세요
      </footer>
    </div>
  );
}

function ReadOnlyRoles({data}){
  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <h3 className="font-bold text-lg mb-2">📌 1인 1역 항목 (조회)</h3>
      <ul className="space-y-2">
        {data.roles.map(r=>{
          const owners = data.students.filter(s=>s.roleIds.includes(r.id)).map(s=>s.name).join(', ') || '없음';
          return (
            <li key={r.id} className="p-2 bg-gray-50 rounded-lg">
              <div className="font-semibold">{r.name}</div>
              <div className="text-xs text-gray-500">담당: {owners}</div>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
